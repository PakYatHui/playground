services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-playground}-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3000}:${CONTAINER_PORT:-3000}"
